[package]
name = "vinpst-cli"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
pipewire-backend = ["vinpst-audio/pipewire-backend"]
sherpa-onnx-backend = ["vinpst-asr/sherpa-onnx-backend"]

[[bin]]
name = "vinpst"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
vinpst-asr = { path = "../vinpst-asr" }
vinpst-audio = { path = "../vinpst-audio" }
vinpst-config = { path = "../vinpst-config" }
vinpst-daemon-control = { path = "../vinpst-daemon-control" }
vinpst-protocol = { path = "../vinpst-protocol" }
vinpst-process = { path = "../vinpst-process" }
vinpst-registry = { path = "../vinpst-registry" }
vinpst-text = { path = "../vinpst-text" }
zbus = { workspace = true, features = ["blocking-api"] }

[dev-dependencies]
tempfile.workspace = true
