[package]
name = "vinput-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
pipewire-backend = ["vinput-audio/pipewire-backend"]
sherpa-onnx-backend = ["vinput-asr/sherpa-onnx-backend"]

[[bin]]
name = "vinput"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
vinput-asr = { path = "../vinput-asr" }
vinput-audio = { path = "../vinput-audio" }
vinput-config = { path = "../vinput-config" }
vinput-protocol = { path = "../vinput-protocol" }
vinput-registry = { path = "../vinput-registry" }
vinput-text = { path = "../vinput-text" }
zbus = { workspace = true, features = ["blocking-api"] }

[dev-dependencies]
tempfile.workspace = true
