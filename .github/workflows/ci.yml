name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure native test tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y dbus libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang pkg-config cmake g++ clang-format clang-tidy gettext locales jq gnupg makepkg pacman-package-manager libarchive-tools zstd libsystemd-dev libfcitx5core-dev fcitx5-modules-dev libgtk-3-dev qt6-base-dev
          sudo locale-gen zh_CN.UTF-8
      - name: Ensure just
        run: |
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --locked
          fi
      - name: Run CI checks
        run: just ci
      - name: Run staged IME activation smoke
        run: scripts/tests/install/run-ime-configured-activation-smoke.sh
      - name: Run deterministic IME e2e smoke
        run: scripts/tests/install/run-ime-e2e-smoke.sh
      - name: Run adapter lifecycle smoke
        run: scripts/tests/cpp/run-cpp-dbus-adapter-lifecycle-smoke.sh
      - name: Run optional PipeWire checks
        run: scripts/tests/pipewire-check.sh
