name: CI

on:
  workflow_call:
    inputs:
      run-deb-packages:
        description: Run the Debian and Ubuntu package transaction matrix
        required: false
        type: string
        default: enabled
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Build documentation strictly
        run: mkdocs build --strict

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure native test tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y dbus libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang pkg-config cmake g++ clang-format clang-tidy gettext locales jq gnupg makepkg pacman-package-manager libarchive-tools zstd libsystemd-dev libfcitx5core-dev fcitx5-modules-dev libgtk-3-dev libgtk-4-dev qt6-base-dev python3-venv
          sudo locale-gen zh_CN.UTF-8
      - name: Ensure Python lint tools
        run: |
          python3 -m venv "${RUNNER_TEMP}/ruff"
          "${RUNNER_TEMP}/ruff/bin/pip" install --disable-pip-version-check ruff==0.16.1
          echo "${RUNNER_TEMP}/ruff/bin" >> "${GITHUB_PATH}"
      - name: Ensure just
        run: |
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --locked
          fi
      - name: Run CI checks
        run: just ci
      - name: Run staged IME activation smoke
        run: scripts/tests/install/run-ime-configured-activation-smoke.sh
      - name: Run deterministic IME e2e smoke
        run: scripts/tests/install/run-ime-e2e-smoke.sh
      - name: Run adapter lifecycle smoke
        run: scripts/tests/daemon/run-dbus-adapter-lifecycle-smoke.sh
      - name: Run optional PipeWire checks
        run: scripts/tests/pipewire-check.sh

  deb-packages:
    if: inputs.run-deb-packages != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            distribution: debian12
          - image: ubuntu:24.04
            distribution: ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and transaction-test Debian package
        run: |
          scripts/release/run-deb-package-smoke.sh \
            --image '${{ matrix.image }}' \
            --distribution '${{ matrix.distribution }}'

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: Build and inspect locked Nix package
        run: scripts/release/run-nix-package-smoke.sh
