name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      run-deb-packages: disabled

  source-archive:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: metadata
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          metadata_args=(--print-version)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            metadata_args+=(--tag "${GITHUB_REF_NAME}")
          fi
          version="$(scripts/release/check-release-metadata.sh "${metadata_args[@]}")"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: Create source archive
        shell: bash
        run: |
          mkdir -p dist
          scripts/release/create-source-archive.sh \
            "dist/fcitx-vinpst-${{ steps.metadata.outputs.version }}.tar.gz" \
            "${{ steps.metadata.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: dist/fcitx-vinpst-${{ steps.metadata.outputs.version }}.tar.gz
          if-no-files-found: error

  deb-packages:
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            distribution: debian12
          - image: ubuntu:24.04
            distribution: ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore package source cache
        uses: actions/cache@v5
        with:
          path: target/package-source-cache
          key: package-sources-${{ runner.os }}-deb-${{ matrix.distribution }}-${{ hashFiles('Cargo.lock', 'packaging/arch/runtime-bundles.json') }}
          restore-keys: |
            package-sources-${{ runner.os }}-deb-${{ matrix.distribution }}-
            package-sources-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release-inputs/source-archive
      - id: release-source
        name: Materialize checked release source
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          archive="${GITHUB_WORKSPACE}/release-inputs/source-archive/fcitx-vinpst-${version}.tar.gz"
          source_dir="$(scripts/release/extract-source-archive.py \
            --archive "${archive}" \
            --version "${version}" \
            --output-root target/release-source)"
          echo "path=${source_dir}" >>"${GITHUB_OUTPUT}"
      - name: Build and transaction-test package
        working-directory: ${{ steps.release-source.outputs.path }}
        shell: bash
        env:
          VINPST_PACKAGE_SOURCE_CACHE: ${{ github.workspace }}/target/package-source-cache
        run: |
          scripts/release/run-deb-package-smoke.sh \
            --image '${{ matrix.image }}' \
            --distribution '${{ matrix.distribution }}'
      - name: Select publication package
        shell: bash
        run: |
          set -euo pipefail
          source_dir='${{ steps.release-source.outputs.path }}'
          mapfile -d '' -t packages < <(
            find "${source_dir}/target/tmp/deb-package-smoke/${{ matrix.distribution }}" \
              -maxdepth 1 -type f \
              -name 'fcitx-vinpst_*-1_${{ matrix.distribution }}_amd64.deb' \
              -print0
          )
          if ((${#packages[@]} != 1)); then
            echo "expected exactly one formal ${{ matrix.distribution }} package, found ${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          rm -rf "dist/${{ matrix.distribution }}"
          mkdir -p "dist/${{ matrix.distribution }}"
          cp "${package}" "dist/${{ matrix.distribution }}/"
          if find "dist/${{ matrix.distribution }}" -type f -name '*-2_*.deb' \
            -print -quit | grep -q .; then
            echo "synthetic upgrade package entered publication selection" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.distribution }}
          path: dist/${{ matrix.distribution }}/*.deb
          if-no-files-found: error

  linux-tarball:
    needs:
      - source-archive
      - deb-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install bundled tarball verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq patchelf
      - uses: actions/download-artifact@v8
        with:
          name: release-deb-ubuntu24.04
          path: release-inputs/ubuntu24.04
      - name: Build bundled Linux tarball from tested Ubuntu payload
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          mapfile -d '' -t packages < <(
            find release-inputs/ubuntu24.04 -type f \
              -name "fcitx-vinpst_${version}-1_ubuntu24.04_amd64.deb" -print0
          )
          if ((${#packages[@]} != 1)); then
            echo "expected exactly one Ubuntu release package, found ${#packages[@]}" >&2
            exit 1
          fi
          scripts/release/build-bundled-linux-tarball.sh \
            --package "${packages[0]}" \
            --version "${version}" \
            --output dist/tarball
      - uses: actions/upload-artifact@v7
        with:
          name: release-tarball-bundled
          path: dist/tarball/*.tar.gz
          if-no-files-found: error

  arch-package:
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Restore package source cache
        uses: actions/cache@v5
        with:
          path: target/package-source-cache
          key: package-sources-${{ runner.os }}-arch-x86_64-${{ hashFiles('Cargo.lock', 'packaging/arch/runtime-bundles.json') }}
          restore-keys: |
            package-sources-${{ runner.os }}-arch-x86_64-
            package-sources-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release-inputs/source-archive
      - id: release-source
        name: Materialize checked release source
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          archive="${GITHUB_WORKSPACE}/release-inputs/source-archive/fcitx-vinpst-${version}.tar.gz"
          source_dir="$(scripts/release/extract-source-archive.py \
            --archive "${archive}" \
            --version "${version}" \
            --output-root target/release-source)"
          source_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          {
            echo "archive=${archive}"
            echo "path=${source_dir}"
            echo "sha256=${source_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - name: Build and transaction-test Arch package
        shell: bash
        run: |
          set -euo pipefail
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          source_dir='${{ steps.release-source.outputs.path }}'
          archive='${{ steps.release-source.outputs.archive }}'
          package_source_cache="${GITHUB_WORKSPACE}/target/package-source-cache"
          mkdir -p "${package_source_cache}"
          docker run --rm --privileged \
            --env "VINPST_HOST_UID=${host_uid}" \
            --env "VINPST_HOST_GID=${host_gid}" \
            --env "VINPST_SOURCE_DIR=${source_dir}" \
            --env "VINPST_SOURCE_ARCHIVE=${archive}" \
            --env VINPST_PACKAGE_SOURCE_CACHE=/package-source-cache \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --volume "${package_source_cache}:/package-source-cache" \
            --workdir "${source_dir}" \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                cargo \
                clang \
                cmake \
                curl \
                dbus \
                fcitx5 \
                fontconfig \
                gettext \
                git \
                glib2 \
                gnupg \
                jq \
                libpipewire \
                libx11 \
                libxkbcommon \
                ninja \
                patchelf \
                pkgconf \
                python \
                rust \
                systemd \
                util-linux \
                wayland
              useradd --create-home --uid 1000 --user-group builder
              install -d -m 700 -o builder -g builder /run/user/1000
              chown -R builder:builder "${VINPST_SOURCE_DIR}" /package-source-cache
              cleanup() {
                chown -R "${VINPST_HOST_UID}:${VINPST_HOST_GID}" \
                  "${VINPST_SOURCE_DIR}" /package-source-cache 2>/dev/null || true
              }
              trap cleanup EXIT
              runuser -u builder -- env \
                HOME=/home/builder \
                XDG_RUNTIME_DIR=/run/user/1000 \
                scripts/release/run-arch-package-smoke.sh \
                  --source-archive "${VINPST_SOURCE_ARCHIVE}"
            '
      - name: Select publication package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          source_dir='${{ steps.release-source.outputs.path }}'
          recorded_source_sha256="$(awk '{print $1}' \
            "${source_dir}/target/tmp/arch-package-smoke/source-archive.sha256")"
          test "${recorded_source_sha256}" = '${{ steps.release-source.outputs.sha256 }}'
          mapfile -d '' -t packages < <(
            find "${source_dir}/target/tmp/arch-package-smoke/build" \
              -maxdepth 1 -type f \
              -name "fcitx-vinpst-${version}-1-x86_64.pkg.tar.zst" \
              -print0
          )
          if ((${#packages[@]} != 1)); then
            echo "expected exactly one formal Arch package, found ${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          rm -rf dist/arch
          mkdir -p dist/arch
          cp "${package}" dist/arch/
          if find dist/arch -type f -name '*-2-*.pkg.tar.zst' \
            -print -quit | grep -q .; then
            echo "synthetic Arch upgrade package entered publication selection" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-arch-x86_64
          path: dist/arch/*.pkg.tar.zst
          if-no-files-found: error

  rpm-package:
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore package source cache
        uses: actions/cache@v5
        with:
          path: target/package-source-cache
          key: package-sources-${{ runner.os }}-rpm-fedora43-x86_64-${{ hashFiles('Cargo.lock', 'packaging/arch/runtime-bundles.json') }}
          restore-keys: |
            package-sources-${{ runner.os }}-rpm-fedora43-x86_64-
            package-sources-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release-inputs/source-archive
      - id: release-source
        name: Materialize checked release source
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          archive="${GITHUB_WORKSPACE}/release-inputs/source-archive/fcitx-vinpst-${version}.tar.gz"
          source_dir="$(scripts/release/extract-source-archive.py \
            --archive "${archive}" \
            --version "${version}" \
            --output-root target/release-source)"
          source_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          {
            echo "archive=${archive}"
            echo "path=${source_dir}"
            echo "sha256=${source_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - name: Build and transaction-test Fedora RPM
        shell: bash
        run: |
          set -euo pipefail
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          source_dir='${{ steps.release-source.outputs.path }}'
          archive='${{ steps.release-source.outputs.archive }}'
          package_source_cache="${GITHUB_WORKSPACE}/target/package-source-cache"
          rust_sysroot="$(rustc --print sysroot)"
          mkdir -p "${package_source_cache}"
          docker run --rm --privileged \
            --env "VINPST_HOST_UID=${host_uid}" \
            --env "VINPST_HOST_GID=${host_gid}" \
            --env "VINPST_SOURCE_DIR=${source_dir}" \
            --env "VINPST_SOURCE_ARCHIVE=${archive}" \
            --env VINPST_PACKAGE_SOURCE_CACHE=/package-source-cache \
            --env "VINPST_RUST_SYSROOT=${rust_sysroot}" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --volume "${package_source_cache}:/package-source-cache" \
            --volume "${rust_sysroot}:${rust_sysroot}:ro" \
            --workdir "${source_dir}" \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y --setopt=install_weak_deps=False \
                bzip2 \
                clang \
                cmake \
                cpio \
                curl \
                fcitx5-devel \
                fontconfig-devel \
                gcc-c++ \
                gettext \
                git \
                jq \
                libX11-devel \
                libxkbcommon-devel \
                ninja-build \
                patchelf \
                pipewire-devel \
                pkgconf-pkg-config \
                python3 \
                rpm-build \
                systemd-devel \
                tar \
                util-linux \
                wayland-devel
              test -x /usr/sbin/runuser
              rpm -qf /usr/sbin/runuser >/dev/null
              export PATH="${VINPST_RUST_SYSROOT}/bin:${PATH}"
              rustc --version
              cargo --version
              cleanup() {
                chown -R "${VINPST_HOST_UID}:${VINPST_HOST_GID}" \
                  "${VINPST_SOURCE_DIR}" /package-source-cache 2>/dev/null || true
              }
              trap cleanup EXIT
              scripts/release/run-rpm-package-smoke.sh \
                --source-archive "${VINPST_SOURCE_ARCHIVE}"
            '
      - name: Select publication RPM
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          source_dir='${{ steps.release-source.outputs.path }}'
          recorded_source_sha256="$(awk '{print $1}' \
            "${source_dir}/target/tmp/rpm-package-smoke/source-archive.sha256")"
          test "${recorded_source_sha256}" = '${{ steps.release-source.outputs.sha256 }}'
          mapfile -d '' -t packages < <(
            find "${source_dir}/target/tmp/rpm-package-smoke/rpmbuild/RPMS" \
              -type f -name "fcitx-vinpst-${version}-1.*.x86_64.rpm" -print0
          )
          if ((${#packages[@]} != 1)); then
            echo "expected exactly one formal RPM, found ${#packages[@]}" >&2
            exit 1
          fi
          rm -rf dist/rpm
          mkdir -p dist/rpm
          cp "${packages[0]}" "dist/rpm/fcitx-vinpst-${version}-1-fedora43-x86_64.rpm"
          if find dist/rpm -type f -name '*-2*.rpm' -print -quit | grep -q .; then
            echo "synthetic RPM upgrade package entered publication selection" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-rpm-fedora43-x86_64
          path: dist/rpm/*.rpm
          if-no-files-found: error

  opensuse-rpm-package:
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore package source cache
        uses: actions/cache@v5
        with:
          path: target/package-source-cache
          key: package-sources-${{ runner.os }}-rpm-opensuse16.0-x86_64-${{ hashFiles('Cargo.lock', 'packaging/arch/runtime-bundles.json') }}
          restore-keys: |
            package-sources-${{ runner.os }}-rpm-opensuse16.0-x86_64-
            package-sources-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release-inputs/source-archive
      - id: release-source
        name: Materialize checked release source
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          archive="${GITHUB_WORKSPACE}/release-inputs/source-archive/fcitx-vinpst-${version}.tar.gz"
          source_dir="$(scripts/release/extract-source-archive.py \
            --archive "${archive}" \
            --version "${version}" \
            --output-root target/release-source)"
          source_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          {
            echo "archive=${archive}"
            echo "path=${source_dir}"
            echo "sha256=${source_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - name: Build and transaction-test openSUSE Leap RPM
        shell: bash
        run: |
          set -euo pipefail
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          source_dir='${{ steps.release-source.outputs.path }}'
          archive='${{ steps.release-source.outputs.archive }}'
          package_source_cache="${GITHUB_WORKSPACE}/target/package-source-cache"
          rust_sysroot="$(rustc --print sysroot)"
          mkdir -p "${package_source_cache}"
          docker run --rm --privileged \
            --env "VINPST_HOST_UID=${host_uid}" \
            --env "VINPST_HOST_GID=${host_gid}" \
            --env "VINPST_SOURCE_DIR=${source_dir}" \
            --env "VINPST_SOURCE_ARCHIVE=${archive}" \
            --env VINPST_PACKAGE_SOURCE_CACHE=/package-source-cache \
            --env "VINPST_RUST_SYSROOT=${rust_sysroot}" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --volume "${package_source_cache}:/package-source-cache" \
            --volume "${rust_sysroot}:${rust_sysroot}:ro" \
            --workdir "${source_dir}" \
            registry.opensuse.org/opensuse/leap:16.0 \
            bash -lc '
              set -euo pipefail
              zypper --gpg-auto-import-keys --non-interactive refresh
              zypper --non-interactive install --no-recommends \
                bzip2 \
                ca-certificates \
                clang \
                cmake \
                cpio \
                curl \
                fcitx5-devel \
                fontconfig-devel \
                gcc-c++ \
                gettext-tools \
                git \
                jq \
                libX11-devel \
                libxkbcommon-devel \
                ninja \
                patchelf \
                pipewire-devel \
                pkg-config \
                python3 \
                rpm-build \
                systemd-devel \
                tar \
                util-linux \
                wayland-devel
              test -x /usr/sbin/runuser
              rpm -qf /usr/sbin/runuser >/dev/null
              export PATH="${VINPST_RUST_SYSROOT}/bin:${PATH}"
              rustc --version
              cargo --version
              cleanup() {
                chown -R "${VINPST_HOST_UID}:${VINPST_HOST_GID}" \
                  "${VINPST_SOURCE_DIR}" /package-source-cache 2>/dev/null || true
              }
              trap cleanup EXIT
              scripts/release/run-rpm-package-smoke.sh \
                --distribution opensuse16.0 \
                --source-archive "${VINPST_SOURCE_ARCHIVE}"
            '
      - name: Select publication openSUSE RPM
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          source_dir='${{ steps.release-source.outputs.path }}'
          recorded_source_sha256="$(awk '{print $1}' \
            "${source_dir}/target/tmp/rpm-package-smoke/source-archive.sha256")"
          test "${recorded_source_sha256}" = '${{ steps.release-source.outputs.sha256 }}'
          mapfile -d '' -t packages < <(
            find "${source_dir}/target/tmp/rpm-package-smoke/rpmbuild/RPMS" \
              -type f -name "fcitx-vinpst-${version}-1.*.rpm" -print0
          )
          if ((${#packages[@]} != 1)); then
            echo "expected exactly one formal openSUSE RPM, found ${#packages[@]}" >&2
            exit 1
          fi
          rm -rf dist/rpm-opensuse
          mkdir -p dist/rpm-opensuse
          cp "${packages[0]}" \
            "dist/rpm-opensuse/fcitx-vinpst-${version}-1-opensuse16.0-x86_64.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: release-rpm-opensuse16.0-x86_64
          path: dist/rpm-opensuse/*.rpm
          if-no-files-found: error

  flatpak-package:
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Restore package source cache
        uses: actions/cache@v5
        with:
          path: target/package-source-cache
          key: package-sources-${{ runner.os }}-flatpak-x86_64-${{ hashFiles('Cargo.lock', 'packaging/arch/runtime-bundles.json') }}
          restore-keys: |
            package-sources-${{ runner.os }}-flatpak-x86_64-
            package-sources-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release-inputs/source-archive
      - id: release-source
        name: Materialize checked release source
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          archive="${GITHUB_WORKSPACE}/release-inputs/source-archive/fcitx-vinpst-${version}.tar.gz"
          source_dir="$(scripts/release/extract-source-archive.py \
            --archive "${archive}" \
            --version "${version}" \
            --output-root target/release-source)"
          source_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          {
            echo "archive=${archive}"
            echo "path=${source_dir}"
            echo "sha256=${source_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - name: Build and transaction-test Flatpak extension
        working-directory: ${{ steps.release-source.outputs.path }}
        shell: bash
        env:
          VINPST_PACKAGE_SOURCE_CACHE: ${{ github.workspace }}/target/package-source-cache
        run: |
          scripts/release/run-flatpak-package-smoke.sh \
            --source-archive '${{ steps.release-source.outputs.archive }}'
      - name: Select publication bundle
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          source_dir='${{ steps.release-source.outputs.path }}'
          summary="${source_dir}/target/tmp/flatpak-package-smoke/summary.json"
          bundle="${source_dir}/target/tmp/flatpak-package-smoke/fcitx-vinpst.flatpak"
          test -s "${summary}"
          test -s "${bundle}"
          recorded_source_sha256="$(awk '{print $1}' \
            "${source_dir}/target/tmp/flatpak-package-smoke/source-archive.sha256")"
          test "${recorded_source_sha256}" = '${{ steps.release-source.outputs.sha256 }}'
          first_commit="$(jq -r '.first_commit' "${summary}")"
          second_commit="$(jq -r '.second_commit' "${summary}")"
          bundle_commit="$(jq -r '.bundle_commit' "${summary}")"
          test -n "${first_commit}"
          test -n "${second_commit}"
          test "${first_commit}" != "${second_commit}"
          test "${bundle_commit}" = "${first_commit}"
          mkdir -p dist/flatpak
          cp "${bundle}" \
            "dist/flatpak/fcitx-vinpst-${version}-x86_64.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: dist/flatpak/*.flatpak
          if-no-files-found: error

  nix-cache:
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: release-inputs/source-archive
      - id: release-source
        name: Materialize checked release source
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          archive="${GITHUB_WORKSPACE}/release-inputs/source-archive/fcitx-vinpst-${version}.tar.gz"
          source_dir="$(scripts/release/extract-source-archive.py \
            --archive "${archive}" \
            --version "${version}" \
            --output-root target/release-source)"
          echo "path=${source_dir}" >>"${GITHUB_OUTPUT}"
      - name: Require Cachix publishing credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "${CACHIX_AUTH_TOKEN}" ]]; then
            echo "CACHIX_AUTH_TOKEN must be configured before release" >&2
            exit 1
          fi
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: fcitx-vinpst
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build, validate, and publish locked Nix closure
        working-directory: ${{ steps.release-source.outputs.path }}
        run: scripts/release/run-nix-package-smoke.sh

  release-bundle:
    needs:
      - quality
      - source-archive
      - linux-tarball
      - arch-package
      - deb-packages
      - rpm-package
      - opensuse-rpm-package
      - flatpak-package
      - nix-cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-inputs
      - name: Assemble checked release bundle
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          select_exact_artifact() {
            local directory="$1"
            local pattern="$2"
            local label="$3"
            local -a files=()
            mapfile -d '' -t files < <(find "${directory}" -type f -print0)
            # The caller supplies the intentional basename glob.
            # shellcheck disable=SC2053
            if ((${#files[@]} != 1)) || [[ "${files[0]##*/}" != ${pattern} ]]; then
              echo "expected exactly one ${label} artifact matching ${pattern@Q}" >&2
              printf 'found: %q\n' "${files[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${files[0]}"
          }
          source_archive="$(select_exact_artifact \
            release-inputs/source-archive \
            "fcitx-vinpst-${version}.tar.gz" \
            source-archive)"
          linux_tarball="$(select_exact_artifact \
            release-inputs/release-tarball-bundled \
            "fcitx-vinpst_${version}-1_linux_x86_64_bundled.tar.gz" \
            linux-tarball-bundled)"
          arch_package="$(select_exact_artifact \
            release-inputs/release-arch-x86_64 \
            "fcitx-vinpst-${version}-1-x86_64.pkg.tar.zst" \
            arch-x86_64)"
          debian_package="$(select_exact_artifact \
            release-inputs/release-deb-debian12 \
            'fcitx-vinpst_*-1_debian12_amd64.deb' \
            deb-debian12)"
          ubuntu_package="$(select_exact_artifact \
            release-inputs/release-deb-ubuntu24.04 \
            'fcitx-vinpst_*-1_ubuntu24.04_amd64.deb' \
            deb-ubuntu24.04)"
          flatpak_bundle="$(select_exact_artifact \
            release-inputs/release-flatpak \
            "fcitx-vinpst-${version}-x86_64.flatpak" \
            flatpak-x86_64)"
          rpm_package="$(select_exact_artifact \
            release-inputs/release-rpm-fedora43-x86_64 \
            "fcitx-vinpst-${version}-1-fedora43-x86_64.rpm" \
            rpm-fedora43-x86_64)"
          opensuse_rpm="$(select_exact_artifact \
            release-inputs/release-rpm-opensuse16.0-x86_64 \
            "fcitx-vinpst-${version}-1-opensuse16.0-x86_64.rpm" \
            rpm-opensuse16.0-x86_64)"
          if find release-inputs -type f -name '*-2_*.deb' -print -quit | grep -q .; then
            echo "release inputs contain a synthetic upgrade package" >&2
            exit 1
          fi
          if find release-inputs -type f -name '*-2-*.pkg.tar.zst' \
            -print -quit | grep -q .; then
            echo "release inputs contain a synthetic Arch upgrade package" >&2
            exit 1
          fi
          if find release-inputs -type f -name '*-2*.rpm' -print -quit | grep -q .; then
            echo "release inputs contain a synthetic RPM upgrade package" >&2
            exit 1
          fi
          scripts/release/release_manifest.py assemble \
            --package-name fcitx-vinpst \
            --version "${version}" \
            --architecture x86_64 \
            --output-dir "dist/fcitx-vinpst-${version}-release" \
            --artifact "source-archive=${source_archive}" \
            --artifact "linux-tarball-bundled=${linux_tarball}" \
            --artifact "arch-x86_64=${arch_package}" \
            --artifact "deb-debian12=${debian_package}" \
            --artifact "deb-ubuntu24.04=${ubuntu_package}" \
            --artifact "flatpak-x86_64=${flatpak_bundle}" \
            --artifact "rpm-fedora43-x86_64=${rpm_package}" \
            --artifact "rpm-opensuse16.0-x86_64=${opensuse_rpm}"
          scripts/release/release_manifest.py verify \
            "dist/fcitx-vinpst-${version}-release"
      - name: Attest checked release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/fcitx-vinpst-${{ needs.source-archive.outputs.version }}-release/*
      - uses: actions/upload-artifact@v7
        with:
          name: checked-release-bundle
          path: dist/fcitx-vinpst-${{ needs.source-archive.outputs.version }}-release/*
          if-no-files-found: error

  release-candidate-install:
    needs:
      - release-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: checked-release-bundle
          path: release
      - name: Install checked bundle in an unrelated environment
        shell: bash
        run: |
          scripts/release/run-release-bundle-install-smoke.sh \
            --bundle-dir release \
            --image ubuntu:24.04

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - source-archive
      - release-bundle
      - release-candidate-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: checked-release-bundle
          path: release
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output release-notes-body.md
          github_token: ${{ github.token }}
      - name: Bind generated notes to the release version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.source-archive.outputs.version }}'
          test -s release-notes-body.md
          {
            printf '# Vinpst %s\n\n' "${version}"
            cat release-notes-body.md
          } >release-notes.md
          test "$(head -n 1 release-notes.md)" = "# Vinpst ${version}"
      - name: Publish checked artifacts
        shell: bash
        run: |
          scripts/release/publish-github-release.sh \
            --tag "${GITHUB_REF_NAME}" \
            --version '${{ needs.source-archive.outputs.version }}' \
            --bundle-dir release \
            --notes-file release-notes.md \
            --repo "${GH_REPO}"
