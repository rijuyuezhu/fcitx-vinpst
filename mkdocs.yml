site_name: Vinpst
site_description: Voice input and voice-driven text editing for Fcitx 5
site_url: https://rijuyuezhu.github.io/fcitx-vinpst/
repo_url: https://github.com/rijuyuezhu/fcitx-vinpst
repo_name: rijuyuezhu/fcitx-vinpst
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

nav:
  - Home: index.md
  - User guide:
      - Installation: user/installation.md
      - Quick start: user/quick-start.md
      - Dictation and command mode: user/usage.md
      - ASR models and providers: user/asr.md
      - Scenes and text processing: user/scenes.md
      - Settings: user/settings.md
      - CLI overview: user/cli.md
      - Troubleshooting: user/troubleshooting.md
      - Known limitations: user/limitations.md
  - Development:
      - Documentation map: development-index.md
      - Development guide: development.md
      - Architecture contracts: architecture/README.md
      - Migration status: migration/function-gap-audit.md
      - Capability matrix: migration/e2e-capability-matrix.md
      - Active plan: migration/e2e-replication-plan.md
      - Upstream source analysis: legacy/README.md

not_in_nav: |
  architecture/**
  legacy/**
  migration/**
  user/**
  live-toolkit-debugging.md

exclude_docs: |
  plan/**

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn
